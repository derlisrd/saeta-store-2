server {
    listen 80;
    server_name _;

    # Mantener el puerto/host original en redirecciones (ej. :8080 en local)
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    # Raíz -> /admin/
    location = / {
        return 302 /admin/;
    }

    # SPA generada por Vite
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Imágenes subidas (volumen compartido con php-fpm)
    location /uploads/ {
        root /var/www/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Nunca ejecutar PHP dentro de uploads
    location ~* ^/uploads/.*\.php$ {
        deny all;
        return 404;
    }

    # API -> php-fpm
    location /api/v1/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # El backend calcula RAIZ usando REQUEST_URI + ROOTPATH,
        # por eso nginx conserva /api/v1/... en REQUEST_URI.
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/v1/index.php;
        fastcgi_param SCRIPT_NAME     /api/v1/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_param HTTP_HOST       $host;
        fastcgi_param SERVER_NAME     $host;
        fastcgi_param HTTPS           $https if_not_empty;

        fastcgi_read_timeout 120s;
    }
}
