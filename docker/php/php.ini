display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 512M
max_execution_time = 120
date.timezone = America/Asuncion
cgi.fix_pathinfo = 0
auto_prepend_file = /usr/local/etc/php/remove-bad-header.php
